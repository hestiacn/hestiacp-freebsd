name: Build MariaDB Packages

on:
  release:
    types: [published]
  push:
    branches:
      - mains
      - release
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build"
        required: true
        default: "main"

jobs:
  build-mariadb:
    name: Build MariaDB 12.3.2 on FreeBSD 14.0
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Build MariaDB Packages
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.0"
          usesh: true
          sync: rsync
          copyback: true
          run: |
            set -e

            # ============================================================
            # 设置时区为上海（UTC+8）
            # ============================================================
            export TZ=Asia/Shanghai
            echo "========================================"
            echo "Build MariaDB 12.3.2 Packages"
            echo "Started at: $(date '+%Y-%m-%d %H:%M:%S %Z')"
            echo "========================================"

            export IGNORE_OSVERSION=yes
            export ASSUME_ALWAYS_YES=yes

            cd /home/runner/work/hestiacp-freebsd/hestiacp-freebsd

            # 设置日志文件路径（FreeBSD VM 内部）
            BUILD_LOG="/tmp/hestiacp-src/mariadb-build/build.log"
            mkdir -p "$(dirname "$BUILD_LOG")"

            echo "[ * ] Installing build dependencies..."
            IGNORE_OSVERSION=yes pkg update -f
            pkg install -y bash cmake gmake gcc14 openssl40 libedit ncurses perl5 pkgconf git wget curl bison flex libxml2 liblz4 libunwind icu groff cyrus-sasl hidapi snappy autoconf automake libtool
            
            if [ ! -L /bin/bash ] && [ ! -f /bin/bash ]; then
                ln -sf /usr/local/bin/bash /bin/bash
                echo "[ ✓ ] Created symlink: /bin/bash -> /usr/local/bin/bash"
            fi
            # 创建 gcc 软链接
            if [ ! -L /usr/local/bin/gcc ] && [ ! -f /usr/local/bin/gcc ]; then
                ln -sf /usr/local/bin/gcc14 /usr/local/bin/gcc
                ln -sf /usr/local/bin/g++14 /usr/local/bin/g++
                echo "✓ Created symlink: gcc -> gcc14"
            fi

            echo ""
            echo "OpenSSL version:"
            /usr/local/bin/openssl version
            echo ""

            # 设置 OpenSSL 环境
            export OPENSSL_ROOT=/usr/local
            export OPENSSL_LIB=/usr/local/lib
            export OPENSSL_INCLUDE=/usr/local/include
            export PKG_CONFIG_PATH="${OPENSSL_LIB}/pkgconfig:/usr/local/lib/pkgconfig"
            export CFLAGS="-I${OPENSSL_INCLUDE} ${CFLAGS:-}"
            export LDFLAGS="-L${OPENSSL_LIB} ${LDFLAGS:-}"

            # 设置 artifacts 目录（FreeBSD VM 内部）
            export ARTIFACT_DIR="/home/runner/work/hestiacp-freebsd/hestiacp-freebsd/artifacts"
            mkdir -p "$ARTIFACT_DIR"

            echo ""
            echo "========================================"
            echo "Starting MariaDB 12.3.2 build..."
            echo "OpenSSL: $OPENSSL_ROOT"
            echo "========================================"
            echo ""

            # 运行构建脚本
            chmod +x src/build-mariadb-packages.sh
            /usr/local/bin/bash src/build-mariadb-packages.sh
            EXIT_CODE=$?

            echo "=== Exit code: $EXIT_CODE ==="

            # 复制构建日志到 artifacts 目录（FreeBSD VM 内部）
            echo "Copying build artifacts..."
            cp "$BUILD_LOG" "$ARTIFACT_DIR/" 2>/dev/null || echo "Warning: Build log not found"
            cp /tmp/hestiacp-src/pkg/*.pkg "$ARTIFACT_DIR/" 2>/dev/null || echo "Warning: No .pkg files found"

            echo ""
            echo "=== Artifacts in $ARTIFACT_DIR ==="
            ls -la "$ARTIFACT_DIR/" || echo "No artifacts found"

            if [ $EXIT_CODE -ne 0 ]; then
                echo ""
                echo "========================================"
                echo "❌ BUILD FAILED"
                echo "========================================"
                echo ""
                echo "=== All errors ==="
                grep -E "error:|Error:|ERROR:" "$BUILD_LOG" | head -50 || echo "No errors found"
                echo ""
                echo "========================================"
                echo "Full build log (last 500 lines):"
                echo "========================================"
                tail -500 "$BUILD_LOG"
                exit 1
            fi

            echo ""
            echo "========================================"
            echo "✅ BUILD AND PACKAGE COMPLETED"
            echo "Finished at: $(date '+%Y-%m-%d %H:%M:%S %Z')"
            echo "========================================"
            echo ""
            echo "=== Build artifacts ==="
            ls -la "$ARTIFACT_DIR/"

      - name: Upload MariaDB packages
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: mariadb-packages
          path: artifacts/*.pkg
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mariadb-build-log
          path: artifacts/build.log
          retention-days: 7